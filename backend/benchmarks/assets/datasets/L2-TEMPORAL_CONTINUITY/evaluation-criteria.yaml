- id: EC-TC-01
  name: State Progression
  description: Object states evolve forward on a plausible trajectory; no unjustified regression
  weight: 0.25
  passThreshold: 90

- id: EC-TC-02
  name: Action Continuity
  description: Character actions follow a logical sequential progression; no jumps back
  weight: 0.25
  passThreshold: 90

- id: EC-TC-03
  name: Event Ordering
  description: Chronological ordering of events is logically consistent (cause before effect)
  weight: 0.20
  passThreshold: 95

- id: EC-TC-04
  name: Attribute Consistency
  description: Object attribute changes are monotonic and justified; no unexplained reversion
  weight: 0.15
  passThreshold: 85

- id: EC-TC-05
  name: Temporal Transition
  description: Time-of-day or scene transitions are accompanied by explicit cues or gradual change
  weight: 0.15
  passThreshold: 85

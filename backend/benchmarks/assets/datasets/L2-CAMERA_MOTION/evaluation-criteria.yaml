- id: EC-CMO-01
  name: Velocity Smoothness
  description: No velocity spikes or sudden changes; acceleration rate per frame < 0.1 unit/frame²
  weight: 0.30
  passThreshold: 90

- id: EC-CMO-02
  name: Motion Type Preservation
  description: Requested motion mode is correctly maintained (push-in stays push-in, orbit stays orbit)
  weight: 0.25
  passThreshold: 95

- id: EC-CMO-03
  name: Velocity Curve Adherence
  description: Actual velocity profile matches expected curve type within 15% tolerance
  weight: 0.20
  passThreshold: 80

- id: EC-CMO-04
  name: Orbital Distance Consistency
  description: Distance to subject center stays within 5% of specified orbit radius
  weight: 0.15
  passThreshold: 85

- id: EC-CMO-05
  name: Motion Continuity
  description: No zero-velocity frames within motion segment (except planned endpoints)
  weight: 0.10
  passThreshold: 95

## L0-001 — Single Shot, Basic

**Purpose:** 最小 Pipeline 验证。仅包含一个镜头、一个角色、一段简单描述。

### Input Files

```text
benchmarks/datasets/L0-001/input/
├── narrative.json
└── v3.json
```

### Expectations

```yaml
compileSuccess: true
minSps: 0.9
minCapabilityCoverage: 0.8
compilerDeterminism: 0.99
maxPipelineDurationMs: 3000
maxDriftCount: 0
```

### Tags

```yaml
capabilities:
  film.character.reference: true
  film.keyframe: true
  film.render.shot: true
  film.camera.path: false
  film.physics.constraint: false
  film.lip.sync: false
  film.temporal.consistency: false
  film.lighting.control: false
  film.style.transfer: false
  film.spatial.layout: false
tags:
  - single-shot
  - basic
  - unit-test
```


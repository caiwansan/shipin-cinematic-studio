name: Diagnostic Matrix Build (A/B/C)

# SPRINT-RELEASE-WINDOWS-WHITE-SCREEN-ROOT-CAUSE-01 — Task 04 构建矩阵
# 触发：push tag diag-*（零 API token；SSH 推 tag 即可）
#   矩阵三版本（同一 Tauri 壳，不同前端）：
#     A = 纯 HTML hello world   → 失败 ⇒ Tauri/WebView2/资源/CSP 问题
#     B = Vue 3 静态页(按钮+路由) → 失败 ⇒ 前端框架层问题
#     C = 完整 Kunlun Media（含诊断模式）→ 失败 ⇒ 业务初始化层问题
# 产物发布到 GitHub Release diag-<tag>（中间仓），服务器脚本拉取到昆仑镜仓库
#   releases/desktop/diagnostic/（不进用户下载页，仅诊断测试用）

permissions:
  contents: write

on:
  push:
    tags: ['diag-*']

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        variant: [a, b, c]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-diag-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-diag-

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      # ── 变体准备：A/B 覆盖前端；C 保留完整壳 ──
      - name: Prepare Variant A (pure HTML)
        if: matrix.variant == 'a'
        shell: pwsh
        run: |
          Copy-Item desktop/diag/a/index.html desktop/ui/index.html -Force
          Copy-Item desktop/diag/a/diag-a.js desktop/ui/diag-a.js -Force
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw
          # RCA-03 TEST ARTIFACT REALITY RESET Task02：版本隔离（文件名/安装目录/窗口标题三隔离，禁止伪装正式版）
          $conf = $conf -replace '"productName": "Kunlun Media"', '"productName": "KunlunMedia-DiagA"'
          $conf = $conf -replace '"title": "昆仑镜 Kunlun Desktop"', '"title": "昆仑镜 DiagA 诊断"'
          Set-Content desktop/src-tauri/tauri.conf.json $conf -NoNewline
          Write-Host 'Variant A prepared (isolated: KunlunMedia-DiagA / 昆仑镜 DiagA 诊断)'

      - name: Prepare Variant B (Vue static)
        if: matrix.variant == 'b'
        shell: pwsh
        run: |
          Copy-Item desktop/diag/b/index.html desktop/ui/index.html -Force
          Copy-Item desktop/diag/b/diag-b-check.js desktop/ui/diag-b-check.js -Force
          Copy-Item desktop/diag/b/vendor/vue.global.prod.js desktop/ui/vue.global.prod.js -Force
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw
          # RCA-03 TEST ARTIFACT REALITY RESET Task02：版本隔离（文件名/安装目录/窗口标题三隔离，禁止伪装正式版）
          $conf = $conf -replace '"productName": "Kunlun Media"', '"productName": "KunlunMedia-DiagB"'
          $conf = $conf -replace '"title": "昆仑镜 Kunlun Desktop"', '"title": "昆仑镜 DiagB 诊断"'
          # RCA-04 CSP 根因修复：Vue 3 全局版需 new Function 编译模板 → CSP 缺 'unsafe-eval' 被拒 → 白屏
          # 仅诊断变体 B 放宽；正式版(C)与 DiagA 保持严格 CSP（产品用 Vite 预编译，无需 eval）
          # 注意：匹配脚本不带前导双引号（csp 值内 script-src 前是 '; '，tauri.conf.json 单处唯一）
          $conf = $conf -replace 'script-src ''self'' ''unsafe-inline''', 'script-src ''self'' ''unsafe-inline'' ''unsafe-eval'''
          Set-Content desktop/src-tauri/tauri.conf.json $conf -NoNewline
          Write-Host 'Variant B prepared (isolated: KunlunMedia-DiagB / 昆仑镜 DiagB 诊断 + unsafe-eval)'

      - name: Prepare Variant C (full shell)
        if: matrix.variant == 'c'
        shell: pwsh
        run: |
          Write-Host 'Variant C = full Kunlun Media shell (unchanged)'

      - name: Show Effective Config
        shell: pwsh
        run: |
          Get-Content desktop/src-tauri/tauri.conf.json | Select-String 'productName|version'
          Get-ChildItem desktop/ui | Select-Object Name, Length

      - name: Clean Stale Bundle (cache residue)
        working-directory: desktop
        run: |
          if (Test-Path 'src-tauri/target/release/bundle') {
            Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -File | Remove-Item -Force
          }
          Write-Host 'bundle cleaned'

      - name: Build (NSIS)
        working-directory: desktop
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List Bundle Artifacts
        working-directory: desktop/src-tauri/target/release/bundle
        run: Get-ChildItem -Recurse | Select-Object FullName, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunlun-diag-${{ matrix.variant }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Download all variants
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/ && sha256sum artifacts/*.exe

      # 幂等发布：同 tag 重跑时先删旧 Release（与 desktop-release.yml 同款模式）
      - name: Clean existing release (idempotent republish)
        run: |
          gh release delete ${{ github.ref_name }} --yes --cleanup-tag || true

      # 发布用 softprops/action-gh-release（与正式版同款；gh CLI create 曾在 publish 步骤失败）
      - name: Publish diagnostic release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Diagnostic Matrix ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: false
          files: artifacts/*.exe

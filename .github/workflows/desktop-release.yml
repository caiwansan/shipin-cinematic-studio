name: Build & Release Kunlun Media (Tauri v2)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build Kunlun Media (NSIS)
        working-directory: desktop
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List Bundle Artifacts
        working-directory: desktop/src-tauri/target/release/bundle
        run: |
          Get-ChildItem -Recurse | Select-Object FullName, Length

      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunlun-media-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  deploy:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kunlun-media-windows
          path: artifacts/

      - name: Deploy to Server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key
          scp -i deploy_key -o StrictHostKeyChecking=no -r artifacts/* root@$DEPLOY_HOST:/root/shipin-cinematic-studio/backend/releases/desktop/
          echo "✅ Kunlun Media installer deployed to server"

name: Build & Release Kunlun Media (Tauri v2)

on:
  # push main → 自动构建（G9 Source Release Reality：每次发行链变更都验证可复制构建）
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
  # 手动正式发版（生成 GitHub Release + exe 资产）
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build Kunlun Media (NSIS)
        working-directory: desktop
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List Bundle Artifacts
        working-directory: desktop/src-tauri/target/release/bundle
        run: |
          Get-ChildItem -Recurse | Select-Object FullName, Length

      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunlun-media-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 正式发版：仅 workflow_dispatch（带版本号）→ GitHub Release（公开资产，GITHUB_TOKEN 自动注入，零 secret 配置）
  # 服务器/官网从公开 Release 下载 exe → releases/desktop/ → latest.json
  publish:
    needs: build-windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kunlun-media-windows
          path: artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Kunlun Media ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: artifacts/*.exe

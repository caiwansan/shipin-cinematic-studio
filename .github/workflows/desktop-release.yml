name: Build & Release Kunlun Media (Tauri v2)

# GITHUB_TOKEN 显式声明写权限（新仓库默认 read-only，创建 Release 需要 contents: write）
permissions:
  contents: write

on:
  # push main → 自动构建（G9 Source Release Reality：每次发行链变更都验证可复制构建）
  push:
    branches: [main]
    # push tag v* → 构建 + 自动发版（SSH 推 tag，零 API token 依赖）
    tags: ['v*']
  # 手动正式发版（生成 GitHub Release + exe 资产）
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-v3-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      # Cargo 缓存命中时 target 目录残留旧版本产物 → 构建前清空 bundle 目录保证只发布当前版本
      - name: Clean Stale Bundle (cache residue)
        working-directory: desktop/src-tauri/target/release/bundle
        run: |
          Get-ChildItem -Recurse -File | Remove-Item -Force
          Write-Host 'bundle cleaned'

      - name: Build Kunlun Media (NSIS)
        working-directory: desktop
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List Bundle Artifacts
        working-directory: desktop/src-tauri/target/release/bundle
        run: |
          Get-ChildItem -Recurse | Select-Object FullName, Length

      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunlun-media-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 正式发版：tag v* 或 workflow_dispatch → GitHub Release（公开资产，GITHUB_TOKEN 自动注入，零 secret 配置）
  # 服务器/官网从公开 Release 下载 exe → releases/desktop/ → latest.json
  publish:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # 幂等发布：同 tag 重跑时先删旧 Release（残留资产会误导拉取脚本）
      - name: Clean existing release (idempotent republish)
        run: |
          gh release delete ${{ github.ref_name }} --yes --cleanup-tag || true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kunlun-media-windows
          path: artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kunlun Media ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: artifacts/*.exe

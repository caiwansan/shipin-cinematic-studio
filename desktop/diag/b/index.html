<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Diag-B: Vue Static</title>
<style>
  body { background: #0e0f1a; color: #e8e6f0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; height: 100vh; }
  #app { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 24px; }
  .sub { color: #8a8aa0; font-size: 13px; margin-bottom: 20px; }
  nav { display: flex; gap: 8px; margin-bottom: 20px; }
  button { background: #c8562a; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button.secondary { background: #1d2038; color: #e8e6f0; border: 1px solid #2d3158; }
  .card { background: #16182b; border: 1px solid #242748; border-radius: 12px; padding: 20px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #1d2038; color: #4ade80; }
  .counter { font-size: 32px; font-weight: 700; margin: 12px 0; }
  .status { font-size: 14px; padding: 10px; border-radius: 8px; margin-top: 16px; background: rgba(74,222,128,.08); color: #4ade80; }
  .env { color: #8a8aa0; font-size: 12px; margin-top: 24px; word-break: break-all; }
</style>
</head>
<body>
<div id="app"></div>
<script src="./vue.global.prod.js"></script>
<script>
// Diag-B: Vue 3 静态页（按钮 + hash 路由切换）— 测前端框架层
// 不加载登录/API/License/Device/Plugin，纯前端渲染
var { createApp, ref, computed } = Vue;

var App = {
  setup() {
    var count = ref(0);
    var route = ref(window.location.hash || '#/');
    window.addEventListener('hashchange', function () { route.value = window.location.hash || '#/'; });
    var view = computed(function () { return route.value.indexOf('#/about') === 0 ? 'about' : 'home'; });
    function go(path) { window.location.hash = path; }
    return { count, view, go, ua: navigator.userAgent };
  },
  template: [
    '<nav>',
    '  <button :class="{secondary: view!==\'home\'}" @click="go(\'#/\')">首页</button>',
    '  <button :class="{secondary: view!==\'about\'}" @click="go(\'#/about\')">关于</button>',
    '</nav>',
    '<div v-if="view === \'home\'" class="card">',
    '  <span class="badge">Vue OK</span>',
    '  <h1>Vue 静态页正常渲染</h1>',
    '  <div class="sub">Diagnostic Matrix — B: Vue 3（测前端框架 / DOM 交互 / 路由）</div>',
    '  <div class="counter">{{ count }}</div>',
    '  <button @click="count++">+1（按钮交互）</button>',
    '  <button class="secondary" @click="count=0">重置</button>',
    '  <div class="status">按钮点击正常 → Vue 事件系统工作</div>',
    '</div>',
    '<div v-else class="card">',
    '  <h1>关于（About 页）</h1>',
    '  <div class="sub">hash 路由切换成功 → 视图挂载/卸载正常</div>',
    '  <div class="env">当前路由: #/about</div>',
    '</div>',
    '<div class="env">UA: {{ ua }}</div>'
  ].join('\n')
};

createApp(App).mount('#app');
document.title = 'DiagB-Vue-OK';
</script>
</body>
</html>

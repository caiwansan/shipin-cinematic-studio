[package]
name = "kunlun-desktop"
version = "1.1.0"
description = "昆仑镜 Kunlun Desktop — AI 应用操作系统桌面壳"
authors = ["Kunlun"]
edition = "2021"

[lib]
name = "kunlun_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必需：tauri build 检测到该 feature 后以 custom-protocol 编译，
# generate_context! 才会嵌入 frontendDist 资源（缺失=白屏，历史根因）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
